# Lint, types, tests at full coverage, and the gates that matter: reproducing data that
# already exists, and refusing what the TypeScript refuses. A second job replays merged
# batches from the data repository's history and requires the files the TypeScript wrote. A
# third records the fixtures that need the data repository's own TypeScript, and fails if a
# committed one is not what that code produces.
#
# The store is pinned to one commit rather than taken from main as it stands. A gate whose
# input moves is a gate whose result cannot be compared with yesterday's: a run that goes red
# would leave two explanations, this library changed or the store did. Bumping the pin is a
# commit, and the numbers it is expected to produce go in that commit: STORE_REF and
# STORE_RECORDS here, and every other count and the digest of each family's files in
# scripts/expected/store-layout.json.
#
# The same holds for what does the recording. Node is named by its exact version, because
# the sets of characters a pattern matches and the lowercase mapping follow the Unicode data
# and the V8 that build carries, and the recordings name the version they were made with.
# Each action is named by a commit, which a tag is not. A test holds both.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # rewire-bio/rewire-benchmark-data, and the record count the gates expect of it.
  STORE_REF: 91f76cf8e61cba9d6037a01a19c9aa3051184900
  STORE_RECORDS: "93216"
  # The results among them that carry a locator, and the rows of the value-check files.
  STORE_LOCATORS: "52278"
  VALUE_CHECK_ROWS: "2432"
  # The checks pack. The data repository commits the report and the baseline of its first run,
  # measured on the store at CHECKS_REF, which is the commit that baseline names and is older
  # than the commit that holds the two files. CHECKS_ROWS is the rows of that report and
  # CHECKS_RECORDS the records it was measured over. CHECKS_PINNED_ROWS is the rows the
  # TypeScript reports at STORE_REF, as the fixtures job records them, and CHECKS_CELLS the
  # distinct printed values parseCell was recorded reading there.
  CHECKS_REF: 991a09ef6b6b417ff51d265bd87d862f49d4dbe3
  CHECKS_ROWS: "10754"
  CHECKS_RECORDS: "93187"
  CHECKS_PINNED_ROWS: "10754"
  CHECKS_CELLS: "26130"
  # The table reader. The HTML and XML artifacts the data repository commits at STORE_REF,
  # the tables the TypeScript reads out of them, the cells of those tables, and the lines the
  # fixtures job records of both.
  TABLE_ARTIFACTS: "97"
  TABLES: "245"
  TABLE_CELLS: "17307"
  TABLE_LINES: "342"
  # The archive read side. The manifest rows, fetch receipts, licence receipts and candidates
  # the pinned checkout commits, its source records and the strings of its licence map, the
  # rows of the triage queue as it is generated there, the lines the fixtures job records of
  # all of them, the commands it records and the TypeScript files it records them from.
  # ARCHIVE_QUEUE_ROWS is the lines of the triage queue the checkout commits, which is two
  # days older than the checkout: every one of them is still a line of the queue generated.
  ARCHIVE_ROWS: "1167"
  ARCHIVE_RECEIPTS: "1526"
  ARCHIVE_RESOLVE_RECEIPTS: "1731"
  ARCHIVE_CANDIDATES: "1091"
  ARCHIVE_SOURCES: "1497"
  ARCHIVE_LICENCES: "97"
  ARCHIVE_TRIAGE_ROWS: "1091"
  ARCHIVE_LINES: "9696"
  ARCHIVE_COMMANDS: "9"
  ARCHIVE_MODULES: "12"
  ARCHIVE_QUEUE_ROWS: "1083"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"

      # Every tool comes from uv.lock, so a new release of a linter cannot turn a run red.
      - name: Install
        run: uv sync --locked --group dev

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy

      # The JavaScript fixtures are recorded again from the script that claims to have
      # produced them. Built-ins only, so there is nothing to install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"
      - name: Fixtures are what Node produces
        run: |
          node scripts/fixtures/record_js_fixture.mjs
          node scripts/fixtures/record_argv_fixture.mjs
          git diff --exit-code -- tests/js-fixture.json tests/fixtures

      - name: Tests, at 100% line and branch coverage
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest --cov --cov-branch --cov-fail-under=100 --cov-report=term-missing 2>&1 | tee coverage.log

      # Public repository, so no token. Shallow by default: the gates read the tree, not history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ env.STORE_REF }}
          path: store

      - name: The checkout is the pinned commit
        run: |
          held=$(git -C store rev-parse HEAD)
          expected=$(jq -r .store_ref scripts/expected/store-layout.json)
          recorded=$(jq -r .recorded_from.store_ref scripts/expected/store-schema.json)
          validated=$(jq -r .recorded_from.store_ref scripts/expected/store-validation.json)
          registry=$(jq -r .recorded_from.store_ref src/rewire_evidence/data/attribute-registry.json)
          located=$(jq -r .recorded_from.store_ref scripts/expected/store-locators.json)
          checked=$(jq -r .recorded_from.store_ref scripts/expected/store-checks.json)
          tabled=$(jq -r .recorded_from.store_ref scripts/expected/store-tables.json)
          archived=$(jq -r .recorded_from.store_ref scripts/expected/store-archive.json)
          for named in "$held" "$expected" "$recorded" "$validated" "$registry" "$located" "$checked" "$tabled" "$archived"; do
            if [ "$named" != "$STORE_REF" ]; then
              echo "::error::STORE_REF is ${STORE_REF}, the checkout is ${held}, the pinned layout was measured at ${expected}, the TypeScript was recorded at ${recorded} and at ${validated}, the attribute registry was read at ${registry}, the locators at ${located}, the checks at ${checked}, the tables at ${tabled} and the archive at ${archived}. All ten must be one commit."
              exit 1
            fi
          done

      # What the recordings state follows the Node they were made on: the sets a pattern
      # matches, the lowercase mapping, and 10 ** n, which is not the nearest double for every
      # n on every V8. The data repository's workflows name a major version and no more, so
      # the build it runs moves without a commit there. This holds the one thing that can be
      # held from here: that the pinned checkout still names the major the recordings are of.
      - name: The data repository runs the Node the recordings were made on
        run: |
          recorded=$(jq -r .recorded_from.node scripts/expected/store-checks.json)
          major=${recorded#v}
          major=${major%%.*}
          named=$(grep -h 'node-version:' store/.github/workflows/*.yml | tr -d "\"' " | cut -d: -f2 | sort -u | tr '\n' ' ')
          if [ "$named" != "${major} " ]; then
            echo "::error::The recordings were made on Node ${recorded}, and the workflows of the pinned checkout name: ${named}. Record again on the Node the data repository runs, and move node-version in the fixtures job with it."
            exit 1
          fi

      - name: Reproduce every committed record digest
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_digests.py store 2>&1 | tee gate.log
          # The gate passes on the records it finds, so a checkout that silently held fewer of
          # them would pass while proving less. The expected count is pinned with the ref. The
          # reported figure is read rather than matched as a string, because the script prints
          # it with thousands separators and the pin is a plain number.
          reported=$(sed -n 's/^All \([0-9,]*\) records reproduce\.$/\1/p' gate.log | tr -d ',')
          if [ "$reported" != "$STORE_RECORDS" ]; then
            echo "::error::The gate reported ${reported:-no} records against a pin of ${STORE_RECORDS}. Either the pinned store moved or fewer records were read."
            exit 1
          fi

      # Every file of every family re-emitted byte for byte, every row in the file the layout
      # assigns it, every record against its provenance row, the logical digests equal to the
      # newest release receipt, and the writers held against the committed files. The script
      # fails on any count that is not the pinned one and on any family whose files are not
      # the pinned bytes, and writes layout.json whenever it could run at all.
      - name: Reproduce the store layout
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_layout.py store --json layout.json 2>&1 | tee layout.log
          measured=$(jq -r '.counts.records_matching_provenance' layout.json)
          if [ "$measured" != "$STORE_RECORDS" ]; then
            echo "::error::The layout gate matched ${measured} records against a pin of ${STORE_RECORDS}."
            exit 1
          fi

      # Every record parsed by the schema and written back as its committed line, then again
      # with its keys in another order; every link, source ID and controlled value checked;
      # the vocabularies read as n3 reads them; the store loaded by load_records; and all of
      # it held to what the TypeScript recorded of the same commit in
      # scripts/expected/store-schema.json, which the fixtures job below records again.
      - name: Hold the store to the record schema and the vocabularies
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_schema.py store --json schema.json 2>&1 | tee schema.log
          for field in records_read records_reproduced records_restored records_loaded; do
            measured=$(jq -r ".${field}" schema.json)
            if [ "$measured" != "$STORE_RECORDS" ]; then
              echo "::error::The schema gate measured ${field} as ${measured} against a pin of ${STORE_RECORDS}."
              exit 1
            fi
          done

      # Every validator of `records -- check` over every record, held to what the TypeScript
      # measured of the same commit in scripts/expected/store-validation.json: how much each
      # validator looked at, every comparison panel as the catalogue query resolves it, and a
      # fault seeded into the whole store for each family of rule, refused in the recorded words.
      - name: Hold the store to every validator
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_validation.py store --json validation.json 2>&1 | tee validation.log
          for field in records_read records_loaded; do
            measured=$(jq -r ".${field}" validation.json)
            if [ "$measured" != "$STORE_RECORDS" ]; then
              echo "::error::The validation gate measured ${field} as ${measured} against a pin of ${STORE_RECORDS}."
              exit 1
            fi
          done
          refused=$(jq -r .seeded_refused validation.json)
          seeded=$(jq -r '.seeded | length' scripts/expected/store-validation.json)
          if [ "$refused" != "$seeded" ] || [ "$seeded" -lt 23 ]; then
            echo "::error::${refused} of ${seeded} seeded faults were refused as recorded, and at least 23 are expected."
            exit 1
          fi

      # The command itself, which is `npm run records -- check`: the line the TypeScript prints.
      - name: Check the store with the command
        run: |
          said=$(uv run --no-sync rewire-evidence records check store)
          recorded=$(jq -r .summary scripts/expected/store-validation.json)
          echo "$said"
          if [ "$said" != "$recorded" ] || [ "$said" != "${STORE_RECORDS} records match their provenance." ]; then
            echo "::error::The command printed '${said}', and the TypeScript printed '${recorded}'."
            exit 1
          fi

      # The write commands on the pinned store, writing nothing. A batch the store already
      # holds is refused by name, and a change shows the one provenance row it would rewrite.
      - name: Dry-run the write commands
        run: |
          batch=data/omics/intake-250-20261119
          first=$(head -n 1 "store/${batch}/batch.jsonl" | jq -r .id)
          status=0
          uv run --no-sync rewire-evidence records add --dry-run --root store "store/${batch}/batch.jsonl" "$batch" 2> refused.log || status=$?
          cat refused.log
          if [ "$status" != 1 ] || [ "$(head -n 1 refused.log)" != "Batch cannot replace or duplicate record: ${first}" ]; then
            echo "::error::Adding a batch the store holds exited ${status}, and should be refused by name with status 1."
            exit 1
          fi
          uv run --no-sync rewire-evidence records change --dry-run --root store docs/reviews/a-review.md "$batch" "$first" > change.log
          cut -c 1-200 change.log
          lost=$(grep -c "^-{\"id\":\"${first}\"" change.log)
          gained=$(grep -c "^+{\"id\":\"${first}\".*\"step\":\"records:change\",\"inputs\":\"${batch}\"" change.log)
          if [ "$lost" != 1 ] || [ "$gained" != 1 ] || [ "$(grep -c '^[-+]{' change.log)" != 2 ]; then
            echo "::error::A dry run of one change should show one provenance row lost and one gained."
            exit 1
          fi
          if [ -n "$(git -C store status --porcelain)" ]; then
            echo "::error::A dry run wrote to the store."
            git -C store status --porcelain
            exit 1
          fi

      # Every locator of every result read by the grammar, and each reading written out as
      # the line the TypeScript wrote for it in scripts/expected/store-locators.jsonl.gz,
      # which the fixtures job below records from shared/omics/locator.ts at the same
      # commit. Then the coverage report, byte for byte the one the data repository
      # commits, and the pattern of grammar version 1 against every row of the value-check
      # files. The script fails on a line that differs and on a count that is not the
      # recorded one, and the counts are pinned here too.
      - name: Read every stored locator as the TypeScript reads it
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_locators.py store --json locators.json 2>&1 | tee locators.log
          for pin in "locators_read:$STORE_LOCATORS" "locators_reproduced:$STORE_LOCATORS" "value_check_rows:$VALUE_CHECK_ROWS" "value_check_agreed:$VALUE_CHECK_ROWS"; do
            measured=$(jq -r ".${pin%%:*}" locators.json)
            if [ "$measured" != "${pin##*:}" ]; then
              echo "::error::The locator gate measured ${pin%%:*} as ${measured} against a pin of ${pin##*:}."
              exit 1
            fi
          done

      # The command itself, which is `npm run locator -- coverage`: the report it writes
      # has to be the one the data repository commits.
      - name: Write the coverage report with the command
        run: |
          uv run --no-sync rewire-evidence locator coverage --root store --out locator-coverage.tsv
          for report in $(jq -r '.report.committed[]' scripts/expected/store-locators.json); do
            cmp locator-coverage.tsv "store/${report}"
          done
          if [ "$(jq -r '.report.committed | length' scripts/expected/store-locators.json)" -lt 1 ]; then
            echo "::error::The TypeScript's report is not one the data repository commits, so there is nothing to hold the command to."
            exit 1
          fi
          if [ -n "$(git -C store status --porcelain)" ]; then
            echo "::error::The command wrote to the store."
            exit 1
          fi

      # The store as it stood when the checks pack was first run: the records and the two
      # vocabularies, which are all the pack reads. The report and the baseline of that run
      # are in the pinned checkout above, because they were committed later.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ env.CHECKS_REF }}
          path: first-run
          sparse-checkout: |
            data/entities
            data/evidence
            data/vocab

      - name: The second checkout is the commit the committed baseline names
        run: |
          held=$(git -C first-run rev-parse HEAD)
          named=$(jq -r .commit store/data/omics/checks-baseline.json)
          recorded=$(jq -r .first_run.commit scripts/expected/store-checks.json)
          for commit in "$held" "$named" "$recorded"; do
            if [ "$commit" != "$CHECKS_REF" ]; then
              echo "::error::CHECKS_REF is ${CHECKS_REF}, the checkout is ${held}, the committed baseline names ${named} and the recording ${recorded}. All four must be one commit."
              exit 1
            fi
          done

      # The seven report-only checks, twice. Over the store of the first run, where the
      # report has to be the committed one row for row and the baseline file the committed
      # one byte for byte. Then over the pinned store, where every row has to be the one
      # the TypeScript wrote in scripts/expected/store-checks.tsv.gz, with the anchor and
      # column of every locator and the reading of every printed value, which the fixtures
      # job below records from scripts/omics/checks/ at the same commit. The script fails
      # on a line that differs, and the counts are pinned here too.
      - name: Report what the checks pack reports
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_checks.py store first-run --json checks.json 2>&1 | tee checks.log
          for pin in "first_rows:$CHECKS_ROWS" "first_rows_reproduced:$CHECKS_ROWS" "first_records:$CHECKS_RECORDS" "pinned_rows:$CHECKS_PINNED_ROWS" "pinned_rows_reproduced:$CHECKS_PINNED_ROWS" "pinned_records:$STORE_RECORDS" "columns.expected:$STORE_LOCATORS" "columns.same:$STORE_LOCATORS" "cells.expected:$CHECKS_CELLS" "cells.same:$CHECKS_CELLS" "baseline_reproduced:true"; do
            measured=$(jq -r ".${pin%%:*}" checks.json)
            if [ "$measured" != "${pin##*:}" ]; then
              echo "::error::The checks gate measured ${pin%%:*} as ${measured} against a pin of ${pin##*:}."
              exit 1
            fi
          done
          # Sixteen rules are declared, and thirteen of them have rows in the first run.
          held=$(jq -r '[.first_rules[] | select(.expected > 0 and .same == .expected)] | length' checks.json)
          if [ "$CHECKS_PINNED_ROWS" -lt 1 ] || [ "$(jq -r '.first_rules | length' checks.json)" != 16 ] || [ "$held" != 13 ]; then
            echo "::error::The checks gate has to hold rows at the pinned commit, and every row of thirteen rules of the first run. It held ${held}."
            exit 1
          fi

      # The commands themselves, which are `npm run checks -- baseline` and `-- report`. The
      # first writes the report and the baseline into the checkout of the first run, which
      # holds neither, and both have to be the files the data repository commits. The second
      # has to find the pinned store no higher than the committed baseline on any count.
      - name: Write the report and the baseline with the commands
        run: |
          set -o pipefail
          run_date=$(jq -r .run_date store/data/omics/checks-baseline.json)
          uv run --no-sync rewire-evidence checks baseline --root first-run --date "$run_date" --commit "$CHECKS_REF" | tee first-run.log
          cmp "first-run/maintenance/reports/checks-${run_date}.tsv" "store/maintenance/reports/checks-${run_date}.tsv"
          cmp first-run/data/omics/checks-baseline.json store/data/omics/checks-baseline.json
          uv run --no-sync rewire-evidence checks report --root store --date "$run_date" --out checks-report.tsv | tee pinned-run.log
          if grep -q "^Check counts rose above" pinned-run.log || ! grep -Eq "^(Counts equal|Below) data/omics/checks-baseline.json" pinned-run.log; then
            echo "::error::The pinned store is above the committed baseline, or the command did not compare the two."
            exit 1
          fi
          gunzip -c scripts/expected/store-checks.tsv.gz | cmp - checks-report.tsv
          if [ -n "$(git -C store status --porcelain)" ]; then
            echo "::error::The command wrote to the pinned store."
            exit 1
          fi

      # Every HTML and XML artifact the pinned checkout commits, read into tables by the
      # reader, and each artifact and each table written out as the line the TypeScript wrote
      # for it in scripts/expected/store-tables.jsonl.gz: the caption, the rows and cells
      # counted, and the digest of the rows, of the rows with small capitals joined and of
      # the headed blocks. The fixtures job below records those lines from
      # scripts/omics/extract/tables.ts at the same commit. The script fails on a line that
      # differs, and the counts are pinned here too.
      - name: Read every committed table as the TypeScript reads it
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_tables.py store --json tables.json 2>&1 | tee tables.log
          for pin in "counts.artifacts:$TABLE_ARTIFACTS" "counts.tables:$TABLES" "counts.cells:$TABLE_CELLS" "lines.expected:$TABLE_LINES" "lines.same:$TABLE_LINES" "module_is_recorded:true"; do
            measured=$(jq -r ".${pin%%:*}" tables.json)
            if [ "$measured" != "${pin##*:}" ]; then
              echo "::error::The table gate measured ${pin%%:*} as ${measured} against a pin of ${pin##*:}."
              exit 1
            fi
          done

      # The manifest, the receipts, the licence map and the candidates of the pinned checkout
      # as the archive read side reads them, each written out as the line the TypeScript
      # wrote for it in scripts/expected/store-archive.jsonl.gz: the verdict of its schema,
      # the digest of the line written back, the tier the classifier gives an object and how
      # reclassify reads it, the work item and the queue row of every source. The fixtures
      # job below records those lines from shared/archive and scripts/archive and
      # scripts/licence at the same commit. Every row a schema reads has to be written back
      # as the committed line. The script fails on a line that differs, on a command that
      # prints anything else, and on a TypeScript file that is not the one recorded, and the
      # counts are pinned here too.
      - name: Read the manifest, the receipts and the licence map as the TypeScript reads them
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_archive.py store --json archive.json 2>&1 | tee archive.log
          for pin in "counts.manifest_rows:$ARCHIVE_ROWS" "written.manifest_rows.same:$ARCHIVE_ROWS" "counts.receipts:$ARCHIVE_RECEIPTS" "written.receipts.same:$ARCHIVE_RECEIPTS" "counts.resolve_receipts:$ARCHIVE_RESOLVE_RECEIPTS" "written.resolve_receipts.same:$ARCHIVE_RESOLVE_RECEIPTS" "counts.candidates:$ARCHIVE_CANDIDATES" "written.candidates.same:$ARCHIVE_CANDIDATES" "counts.sources:$ARCHIVE_SOURCES" "counts.licences:$ARCHIVE_LICENCES" "counts.triage_rows:$ARCHIVE_TRIAGE_ROWS" "lines.expected:$ARCHIVE_LINES" "lines.same:$ARCHIVE_LINES" "commands.same:$ARCHIVE_COMMANDS" "modules.same:$ARCHIVE_MODULES" "queue_rows.expected:$ARCHIVE_QUEUE_ROWS" "queue_rows.same:$ARCHIVE_QUEUE_ROWS"; do
            measured=$(jq -r ".${pin%%:*}" archive.json)
            if [ "$measured" != "${pin##*:}" ]; then
              echo "::error::The archive gate measured ${pin%%:*} as ${measured} against a pin of ${pin##*:}."
              exit 1
            fi
          done

      # The commands themselves, which are `npm run archive -- worklist`, `status`, `verify`
      # and `reclassify --dry-run`, and the two licence scripts. Each has to print what the
      # TypeScript printed at the pinned commit and leave with its status, and none may write.
      - name: Print what the archive and licence commands print
        run: |
          date=$(jq -r .triage.date scripts/expected/store-archive.json)
          said() {
            at=$1; shift
            status=0
            uv run --no-sync rewire-evidence "$@" > said.out || status=$?
            recorded=$(jq -r ".commands[${at}].status" scripts/expected/store-archive.json)
            if [ "$status" != "$recorded" ]; then
              echo "::error::'$*' left with status ${status}, and the TypeScript's left with ${recorded}."
              exit 1
            fi
            if jq -e ".commands[${at}] | has(\"stdout\")" scripts/expected/store-archive.json > /dev/null; then
              jq -j ".commands[${at}].stdout" scripts/expected/store-archive.json | cmp - said.out
            else
              printed=$(sha256sum said.out | cut -d ' ' -f 1)
              if [ "$printed" != "$(jq -r ".commands[${at}].stdout_sha256" scripts/expected/store-archive.json)" ]; then
                echo "::error::'$*' did not print what the TypeScript printed."
                exit 1
              fi
            fi
          }
          said 0 archive worklist --root store
          said 1 archive worklist --root store --json
          said 2 archive status --root store
          said 3 archive status --root store --json
          said 4 archive verify --root store
          said 5 archive reclassify --root store --dry-run
          said 6 archive reclassify --root store --dry-run --json
          said 7 licence triage --root store --stdout --date "$date"
          said 8 licence counts store
          if [ "$(jq -r '.commands | length' scripts/expected/store-archive.json)" != "$ARCHIVE_COMMANDS" ]; then
            echo "::error::The recording holds another number of commands than the ${ARCHIVE_COMMANDS} run here."
            exit 1
          fi
          if [ -n "$(git -C store status --porcelain)" ]; then
            echo "::error::A command wrote to the pinned store."
            git -C store status --porcelain
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Checks"
            echo
            echo "Store pinned at \`${STORE_REF}\`, expecting ${STORE_RECORDS} records."
            if [ -f coverage.log ]; then echo; echo "### Coverage"; echo; echo '```'; sed -n '/^Name /,$p' coverage.log; echo '```'; fi
            if [ -f gate.log ]; then echo; echo "### Record digests"; echo; echo '```'; cat gate.log; echo '```'; fi
            if [ -f layout.log ]; then echo; echo "### Store layout"; echo; echo '```'; cat layout.log; echo '```'; fi
            if [ -f schema.log ]; then echo; echo "### Schema and vocabularies"; echo; echo '```'; cat schema.log; echo '```'; fi
            if [ -f validation.log ]; then echo; echo "### Validators"; echo; echo '```'; cat validation.log; echo '```'; fi
            if [ -f locators.log ]; then echo; echo "### Locators"; echo; echo '```'; cat locators.log; echo '```'; fi
            if [ -f checks.log ]; then echo; echo "### Checks pack"; echo; echo '```'; cat checks.log; echo '```'; fi
            if [ -f tables.log ]; then echo; echo "### Table reader"; echo; echo '```'; cat tables.log; echo '```'; fi
            if [ -f archive.log ]; then echo; echo "### Archive read side"; echo; echo '```'; cat archive.log; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The write path, held to the data repository's own history. Each case is a merged pull
  # request that added a batch or recorded a change: the store is laid out as the merge's
  # first parent holds it, the commands are run again by this library, and every store file
  # has to be the merge commit's, by git's own blob names. The clone has the history and no
  # file contents, and the gate fetches the blobs of the stores it lays out.
  #
  # History has no `records change --changes`, so three more cases are writes the TypeScript
  # made itself: the fixtures job below adds and applies the data repository's reviewer fixture
  # to the pinned store, applies two changes files written from the store, and records the
  # blob name of every file left each time, in scripts/expected/store-recorded-writes.json.
  # The gate replays them from the pinned commit.
  writes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # What the two expectations amount to: twelve merged pull requests and three recorded
      # writes. A replay that does less fails.
      WRITE_CASES: "15"
      WRITE_RECORDS_ADDED: "2601"
      WRITE_CHANGES_RECORDED: "1283"
      WRITE_FILES_COMPARED: "1185"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group dev

      - name: Clone the history of the data repository, without file contents
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/rewire-bio/rewire-benchmark-data.git history

      # Every case is part of the store the other gates are pinned to, and the recorded
      # writes were made on the pinned commit itself.
      - name: The cases are in the history of the pinned commit
        run: |
          for merge in $(jq -r '.cases[].merge' scripts/expected/store-writes.json); do
            if ! git -C history merge-base --is-ancestor "$merge" "$STORE_REF"; then
              echo "::error::${merge} is not an ancestor of STORE_REF ${STORE_REF}."
              exit 1
            fi
          done
          for named in $(jq -r '.recorded_from.store_ref, .cases[].store' scripts/expected/store-recorded-writes.json); do
            if [ "$named" != "$STORE_REF" ]; then
              echo "::error::The recorded write names ${named}, and STORE_REF is ${STORE_REF}."
              exit 1
            fi
          done

      # The commands of each case are worked out from the provenance rows its merge changed.
      # They are worked out again here, so the committed cases are what the script gives for
      # this history and not something edited afterwards.
      - name: The cases are what the history states
        run: |
          uv run --no-sync python scripts/fixtures/derive_write_cases.py history $(jq -r '.cases[].merge' scripts/expected/store-writes.json) > derived.json
          diff derived.json scripts/expected/store-writes.json

      - name: Replay merged batches and changes, and the recorded writes
        run: |
          set -o pipefail
          uv run --no-sync python scripts/verify_store_writes.py history --json writes.json 2>&1 | tee writes.log
          for pin in "cases:$WRITE_CASES" "reproduced:$WRITE_CASES" "records_added:$WRITE_RECORDS_ADDED" "changes_recorded:$WRITE_CHANGES_RECORDED" "files_compared:$WRITE_FILES_COMPARED"; do
            measured=$(jq -r ".${pin%%:*}" writes.json)
            if [ "$measured" != "${pin##*:}" ]; then
              echo "::error::The write gate measured ${pin%%:*} as ${measured} against a pin of ${pin##*:}."
              exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Writes"
            if [ -f writes.log ]; then echo; echo '```'; cat writes.log; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The fixtures that need the data repository's own code: its zod schema, its vocabulary
  # loader and the n3 it locks. They are recorded again here, inside the pinned checkout with its
  # locked dependencies installed, and the job fails if a committed file is not what the
  # TypeScript produces. Nothing is installed anywhere but this runner.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ env.STORE_REF }}
          path: store
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: store/package-lock.json
      - name: Install the data repository's locked dependencies
        working-directory: store
        run: npm ci --no-audit --no-fund
      - name: Record from the TypeScript
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_schema_fixture.mjs
      # The validators, on cases written for them and on the pinned store itself. Each fault
      # seeded into the whole store runs a validator over every record, which is most of the time.
      - name: Record the validators
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_validation_fixture.mjs
      # The write path, on small stores in a scratch folder: what addBatch, recordChanges and
      # applyChanges return or refuse, and every file they leave different. It reads the
      # small store the step before wrote into tests/fixtures/validation.json. Then the
      # reviewer fixture, added and applied to a copy of the pinned store, and two changes
      # files written from the store by scripts/fixtures/store_changes.mjs.
      - name: Record the write path
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_write_fixture.mjs
      # How Node writes text in lowercase, which follows the Unicode version it was built
      # with. Built-ins only, on the Node the data repository's workflows run.
      - name: Record the lowercase mapping
        run: node scripts/fixtures/record_lowercase.mjs
      # Which characters each class, escape and letter of the library's patterns matches,
      # which follows the same Unicode version, and what a list of patterns matches in a
      # list of texts. Built-ins only.
      - name: Record the patterns
        run: node scripts/fixtures/record_pattern_fixture.mjs
      # The locator grammar: its reading of every locator in the pinned store, the coverage
      # report its command writes for that store, and its answers on locators the store has
      # no example of.
      - name: Record the locator grammar
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_locator_fixture.mjs
      # The checks pack: its run over the pinned store, with the report, the anchor and
      # column of every locator and parseCell's reading of every printed value, and what it
      # does with cells, small stores, baselines and command lines the store has no like of.
      - name: Record the checks pack
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_checks_fixture.mjs
      # The table reader: every pattern written in scripts/omics/extract/tables.ts as the
      # compiler reads the file, the tables it reads out of every HTML and XML artifact the
      # pinned checkout commits, and what it does with sources, captions, sections, headers
      # and text layers the artifacts have no like of.
      - name: Record the table reader
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_tables_fixture.mjs
      # The archive read side and the licence map: every manifest row, receipt and candidate
      # of the pinned checkout held to its schema and written back, the work list, the triage
      # queue and the reclassification plan, what each command prints, and what the schemas,
      # the manifest writes, the cache check and the classifier do with rows and trees the
      # checkout has no like of.
      - name: Record the archive read side
        working-directory: store
        run: node_modules/.bin/tsx ../scripts/fixtures/record_archive_fixture.mjs
      - name: Keep what was recorded
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-fixtures
          path: |
            tests/fixtures/record-schema.json
            tests/fixtures/vocabularies.json
            tests/fixtures/turtle.json
            tests/fixtures/validation.json
            tests/fixtures/write-path.json
            tests/fixtures/js-patterns.json
            tests/fixtures/locator.json
            tests/fixtures/checks.json
            tests/fixtures/tables.json
            tests/fixtures/archive.json
            scripts/expected/store-archive.json
            scripts/expected/store-archive.jsonl.gz
            scripts/expected/store-tables.json
            scripts/expected/store-tables.jsonl.gz
            scripts/expected/store-checks.json
            scripts/expected/store-checks.tsv.gz
            scripts/expected/store-checks-columns.jsonl.gz
            scripts/expected/store-checks-cells.jsonl.gz
            scripts/expected/store-locators.json
            scripts/expected/store-locators.jsonl.gz
            scripts/expected/store-schema.json
            scripts/expected/store-validation.json
            scripts/expected/store-recorded-writes.json
            scripts/expected/changes
            src/rewire_evidence/data/attribute-registry.json
            src/rewire_evidence/data/lowercase.json
            src/rewire_evidence/data/pattern-classes.json
            src/rewire_evidence/data/powers-of-ten.json
          if-no-files-found: ignore
      - name: Fixtures are what the TypeScript produces
        run: |
          changed=$(git status --porcelain -- tests/fixtures scripts/expected src/rewire_evidence/data)
          if [ -n "$changed" ]; then
            echo "::error::The recorded fixtures differ from the committed ones. Download the schema-fixtures artifact and commit it."
            echo "$changed"
            git diff --stat -- tests/fixtures scripts/expected src/rewire_evidence/data
            exit 1
          fi
